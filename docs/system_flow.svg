<text class="th" x="340" y="140" text-anchor="middle" fill="#085041">PEAD scanner</text>
<text class="ts" x="340" y="157" text-anchor="middle" fill="#0F6E56">earnings drift</text>
<rect x="448" y="120" width="176" height="48" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="536" y="140" text-anchor="middle" fill="#085041">Core discovery</text>
<text class="ts" x="536" y="157" text-anchor="middle" fill="#0F6E56">weekly quality screen</text>

<line class="arr" x1="144" y1="168" x2="238" y2="198" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="168" x2="340" y2="198" marker-end="url(#arrow)"/>
<line class="arr" x1="536" y1="168" x2="442" y2="198" marker-end="url(#arrow)"/>

<rect x="190" y="200" width="300" height="48" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
