<svg width="680" height="700" viewBox="0 0 680 700" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Compounder system flow</title>
<desc>Tree diagram: scheduled jobs trigger three discovery scanners, which feed mechanical gates, a proposals ledger, the LLM portfolio manager, the paper-trading executor, open positions with exit rails, and a measurement loop that feeds scores back to the portfolio manager. Telegram connects the human to the PM.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
  text { font-family: 'Helvetica Neue', Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; font-weight: 400; }
  .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
</style>

<rect x="90" y="40" width="500" height="44" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="340" y="58" text-anchor="middle" fill="#444441">Scheduled jobs (launchd)</text>
<text class="ts" x="340" y="75" text-anchor="middle" fill="#5F5E5A">watchdog &#183; scanners &#183; screens &#183; scoring</text>

