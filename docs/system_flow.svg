<text class="ts" x="260" y="557" text-anchor="middle" fill="#0F6E56">stops &#183; trims &#183; time exits</text>

<line class="arr" x1="260" y1="568" x2="260" y2="598" marker-end="url(#arrow)"/>

<rect x="120" y="600" width="280" height="48" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
